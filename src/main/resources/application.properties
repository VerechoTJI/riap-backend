spring.datasource.url=jdbc:h2:mem:riapdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# UAS JWT settings. The secret is a development default; override
# uas.jwt.secret in the deployment environment (e.g. UAS_JWT_SECRET) and never
# commit a real production secret. HS256 requires at least a 256-bit key.
uas.jwt.secret=${UAS_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
uas.jwt.expiration-minutes=60
