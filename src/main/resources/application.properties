spring.application.name=riap

# H2 Database Config (from main branch)
spring.datasource.url=jdbc:h2:mem:riapdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL datasource (from LSS branch, override via environment variables in production)
app.datasource.url=jdbc:postgresql://localhost:5432/riap
app.datasource.username=riap
app.datasource.password=riap

# Hibernate (from LSS branch)
hibernate.hbm2ddl.auto=validate
hibernate.show_sql=false
