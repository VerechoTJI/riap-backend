# PostgreSQL profile (DBMS-N-12 / RIAP-N-02 / STD environment).
#
# Activate with one of:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#   SPRING_PROFILES_ACTIVE=postgres java -jar target/riap-*.jar
#
# The default profile stays on in-memory H2 so tests and quick local runs need no
# external database. The password is never committed: supply it via DB_PASSWORD.

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:riap}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP pool sizing for the concurrency / latency budget (DBMS-N-05, DBMS-N-10).
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
